[project]
name = "madify"
version = "0.1.0"
description = "Photo cataloguer and metadata assistant."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Scott Mills", email = "scott@sgmstudfios.ca" },
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
madify = "madify:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "ruff==0.12.4",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",      # docs are Phase 4
    "COM812", # conflicts with formatter
    "ISC001", # conflicts with formatter
]

[tool.ruff.lint.per-file-ignores]
"src/madify/__init__.py" = ["T201"]
"src/madify/__main__.py" = ["T201"]
"tests/**/*.py" = ["S101", "S603", "INP001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
