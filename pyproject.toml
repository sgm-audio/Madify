[project]
name = "madify"
version = "0.2.0"
description = "Photo cataloguer and metadata assistant."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Scott Mills", email = "scott@sgmstudios.ca" },
]
requires-python = ">=3.12"
dependencies = []
keywords = [
    "photography",
    "metadata",
    "cli",
    "sqlite",
    "media",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/scottmills306/Madify"
Repository = "https://github.com/scottmills306/Madify"
Issues = "https://github.com/scottmills306/Madify/issues"
Changelog = "https://github.com/scottmills306/Madify/blob/main/CHANGELOG.md"

[project.scripts]
madify = "madify:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pdoc==15.0.4",
    "pre-commit==4.6.0",
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "ruff==0.15.22",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with formatter
    "ISC001", # conflicts with formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/madify/__init__.py" = ["T201"]
"src/madify/__main__.py" = ["T201"]
"src/madify/cli.py" = ["T201"]
"tests/**/*.py" = ["D", "S101", "S603", "INP001", "SLF001", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.coverage.run]
branch = false
source = ["madify"]
omit = [
    "src/madify/cli.py",
    "src/madify/__main__.py",
    "src/madify/system_clock.py",
    "src/madify/local_fs.py",
    "src/madify/ports.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
